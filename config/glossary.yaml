# Public Computational Lithography Glossary
# Used for Whisper initial_prompt, LLM prompt enhancement, and deterministic term normalization.

canonical_terms:
  - term: "ILT"
    definition: "Inverse Lithography Technology (反向微影技術)"
  - term: "SMO"
    definition: "Source Mask Optimization (光源光罩協同優化)"
  - term: "High NA"
    definition: "High Numerical Aperture EUV (高數值孔徑極紫外光微影)"
  - term: "DPT"
    definition: "Double Patterning Technology (雙重圖案化技術)"
  - term: "Double Patterning"
    definition: "Multiple exposure/patterning lithography technique"
  - term: "OPC"
    definition: "Optical Proximity Correction (光學鄰近效應修正)"
  - term: "EUV"
    definition: "Extreme Ultraviolet Lithography (極紫外光微影)"
  - term: "curvilinear mask"
    definition: "Curvilinear mask geometry for advanced nodes"
  - term: "cost function"
    definition: "Objective function used in lithography optimization"
  - term: "mask"
    definition: "Photomask / reticle geometry"
  - term: "source"
    definition: "Illumination source distribution"
  - term: "resist"
    definition: "Photoresist chemical and threshold model"
  - term: "SRAF"
    definition: "Sub-Resolution Assist Feature"
  - term: "aerial image"
    definition: "Optical intensity distribution at the wafer plane"
  - term: "EPE"
    definition: "Edge Placement Error"
  - term: "dose"
    definition: "Exposure energy dose"
  - term: "focus"
    definition: "Exposure tool focal position"
  - term: "defocus"
    definition: "Focal distance offset"
  - term: "pupil"
    definition: "Lens pupil or source pupil illumination"
  - term: "wafer"
    definition: "Semiconductor silicon wafer"

